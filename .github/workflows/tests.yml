name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    name: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the seam tests
        run: /bin/bash tests/run
      - name: prove every break is caught
        run: /bin/bash tests/breaks/run
